[extend]
useDefault = true

# Supabase explicitly publishes this browser key. Only the generic rule,
# the exact config.js location and the publishable key format are exempted.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Supabase public browser key, not a server credential"
condition = "AND"
paths = ['''(^|/)config\.js$''']
regexes = ['''^sb_publishable_[A-Za-z0-9_-]+$''']
