name: Deploy tested school portal to existing Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-portal-cloudflare
  cancel-in-progress: false

jobs:
  security-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject confidential school data
        run: python3 scripts/check-confidential-repo.py
      - name: Install pinned Gitleaks release
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan Git history and current tree
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: bash scripts/scan-secrets.sh

  deploy:
    needs: security-preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recheck source and Worker snapshot
        run: |
          node --check app.js
          node --check features.js
          node --check portal-extras.js
          node --check public-visa.js
          node --check scripts/deploy-worker-safe.mjs
          node --test tests/portal-extras.mjs
          node --test tests/rng-hotspots.mjs
          sh scripts/build-static.sh
          node scripts/build-worker.mjs
          node --check dist/schule-als-staat-worker.js
      - name: Update existing Worker assets only (zero-cost)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare deployment skipped: account ID and API token secrets are not configured."
            exit 0
          fi
          node scripts/deploy-worker-safe.mjs
