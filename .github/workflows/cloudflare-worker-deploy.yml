name: Deploy tested school portal to existing Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-portal-cloudflare
  cancel-in-progress: false

jobs:
  security-preflight:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/secret-scan.yml

  deploy:
    needs: security-preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Recheck source and Worker snapshot
        run: |
          node --check app.js
          node --check features.js
          node --check portal-extras.js
          node --check public-visa.js
          node --check scripts/deploy-worker-safe.mjs
          node --test tests/portal-extras.mjs
          node --test tests/rng-hotspots.mjs
          sh scripts/build-static.sh
          node scripts/build-worker.mjs
          node --check dist/schule-als-staat-worker.js
      - name: Update existing Worker assets only (zero-cost)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare deployment skipped: account ID and API token secrets are not configured."
            exit 0
          fi
          node scripts/deploy-worker-safe.mjs
