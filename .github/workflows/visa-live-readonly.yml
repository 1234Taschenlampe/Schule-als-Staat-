name: ViSA public Cloudflare production smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-visa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install temporary free browser driver
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1
          command -v google-chrome
      - name: Test live Visa pages at 390px and 1280px, read-only
        run: CHROME_PATH="$(command -v google-chrome)" node tests/visa-live-readonly.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visa-live-screenshots
          path: visa-live-*.png
          retention-days: 2
          if-no-files-found: ignore
