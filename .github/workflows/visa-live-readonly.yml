name: ViSA public Cloudflare production smoke
on:
  pull_request:
    branches: [main]
    paths: [public-visa.js, tests/visa-live-readonly.mjs, .github/workflows/visa-live-readonly.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-visa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install temporary free browser driver
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1
          command -v google-chrome
      - name: Test live Visa pages at 390px and 1280px, read-only
        run: CHROME_PATH="$(command -v google-chrome)" node tests/visa-live-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visa-live-screenshots
          path: visa-live-*.png
          retention-days: 2
          if-no-files-found: ignore
