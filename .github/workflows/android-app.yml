name: Build SaS Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.6.0"
      - name: Build Android debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: test -s android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable admin preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Schule-als-Staat-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: android-apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Schule-als-Staat-Android-APK
      - name: Publish stable direct-download APK (admin preview)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app-debug.apk "Schule-als-Staat-Admin-Vorschau.apk"
          # A GitHub Release asset is directly downloadable without the ZIP/artifact UI.
          # Never publish this debug-signed preview as a production app.
          if gh release view "android-admin-preview" >/dev/null 2>&1; then
            gh release upload "android-admin-preview" "Schule-als-Staat-Admin-Vorschau.apk" --clobber
          else
            gh release create "android-admin-preview" "Schule-als-Staat-Admin-Vorschau.apk" \
              --target "$GITHUB_SHA" \
              --title "Schule als Staat – Android Admin-Vorschau" \
              --notes "Experimentelle Android-App als APK zum direkten Download. Debug-signiert, nur für interne Tests. Keine NFC-Zahlungen. Installation ausschließlich auf Android-Geräten." \
              --prerelease --latest=false
          fi
