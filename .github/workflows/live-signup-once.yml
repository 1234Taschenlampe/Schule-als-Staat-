name: One-time live Supabase signup smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-signup-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Signup → password login → profile/wallet/card with production Supabase (temporary test account)
        run: node tests/live-signup-smoke.mjs
