name: Read public RNG school floorplan rooms
on:
  pull_request:
    paths:
      - '.github/workflows/rng-room-scan.yml'
permissions:
  contents: read
jobs:
  scan-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download official public PDF and extract labeled rooms
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.rng-wangen.de/wp-content/uploads/2024/07/230625_digitaler-uebersichtsplan.pdf"
          curl -fLsS --connect-timeout 12 --max-time 70 --retry 1 -o /tmp/rng-campus.pdf "$URL"
          file /tmp/rng-campus.pdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfinfo /tmp/rng-campus.pdf | head -24
          pdftotext -layout -enc UTF-8 /tmp/rng-campus.pdf /tmp/rng-campus.txt
          pdftotext -bbox -enc UTF-8 /tmp/rng-campus.pdf /tmp/rng-campus.html
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          content=Path('/tmp/rng-campus.txt').read_text(errors='replace')
          pages=content.split('\f')
          print('PDF_PAGES_BEGIN',len(pages))
          for i,body in enumerate(pages,1):
              if not body.strip():continue
              print('=== PAGE',i,'===')
              for line in body.splitlines():
                  line=line.strip()
                  if line:print('TEXT:',line[:400])
          print('PDF_PAGES_END')
          print('PDF_WORD_POSITIONS_BEGIN')
          xml=ET.parse('/tmp/rng-campus.html').getroot()
          for pi,p in enumerate((e for e in xml.iter() if e.tag.endswith('page')),1):
              try:w=float(p.attrib['width']);h=float(p.attrib['height'])
              except:continue
              print('PAGE_GEOMETRY',pi,round(w,1),round(h,1))
              for line in p.iter():
                  if not line.tag.endswith('line'):continue
                  tokens=[x for x in line if x.tag.endswith('word')]
                  words=[(t.text or '').strip() for t in tokens]
                  for ix,word in enumerate(words):
                      name=word.replace(' ','').strip()
                      good=bool(re.fullmatch(r'[A-Z][0-3][0-9]{2}[a-zA-Z]?',name))
                      joined=False
                      if not good and re.fullmatch(r'[A-Z]',name) and ix+1<len(words) and re.fullmatch(r'[0-3][0-9]{2}',words[ix+1]):
                          name=name+words[ix+1];good=True;joined=True
                      if good:
                          t=tokens[ix]
                          x0=float(t.attrib['xMin']);x1=float(t.attrib['xMax'])
                          y0=float(t.attrib['yMin']);y1=float(t.attrib['yMax'])
                          if joined:
                              t2=tokens[ix+1];x1=max(x1,float(t2.attrib['xMax']));y1=max(y1,float(t2.attrib['yMax']))
                          print('ROOM_POSITION',pi,name,round((x0+x1)/2/w*100,2),round((y0+y1)/2/h*100,2),'WORDS',' '.join(words[:25])[:220])
          print('PDF_WORD_POSITIONS_END')
          PY
