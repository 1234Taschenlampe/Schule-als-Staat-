name: Overlord production read-only smoke
on:
  push:
    branches: [main]
    paths: [tests/overlord-live-readonly.mjs, .github/workflows/overlord-live-readonly.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only production HTTP smoke (no sign-in or mutation)
        run: node --test tests/overlord-live-readonly.mjs
