name: Mobile product polish
on:
  pull_request:
    branches: [main]
    paths:
      - app.js
      - index.html
      - mobile-ui.css
      - styles.css
      - scripts/build-worker.mjs
      - tests/mobile-browser-polish.mjs
      - .github/workflows/mobile-browser-polish.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and Cloudflare bundle
        run: |
          node --check app.js
          node --check scripts/build-worker.mjs
          node scripts/build-worker.mjs
          node --check dist/schule-als-staat-worker.js
      - name: Install headless Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test phone widths, navigation, login and responsive source
        run: node --test tests/mobile-browser-polish.mjs
