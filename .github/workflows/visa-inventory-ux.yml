name: SaS inventory and guest Visa UI
on:
  pull_request:
    branches: [main]
    paths:
      - shop-management.js
      - mobile-ui.css
      - tests/shop-inventory-browser.mjs
      - tests/visa-turnstile-inventory-ui.mjs
      - supabase/functions/visa-request/index.ts
      - supabase/migrations/20261027_visa_turnstile_vault_access.sql
      - .github/workflows/visa-inventory-ux.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: |
          node --check shop-management.js
          node --test tests/visa-turnstile-inventory-ui.mjs
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          command -v google-chrome
      - run: CHROME_PATH="$(command -v google-chrome)" node --test tests/shop-inventory-browser.mjs
