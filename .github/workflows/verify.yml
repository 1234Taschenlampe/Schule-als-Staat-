name: V4 source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: JavaScript syntax and source invariants
        run: |
          node --check app.js
          node --check features.js
          node --check physical-card-shop.js
          node --test tests/physical-card-shop.mjs
          node --test tests/edge-body.mjs tests/browser-dependencies.mjs
          node --test tests/editorial-quality.mjs
          node --test tests/android-app-preview.mjs
          node --check shop-plan.js
          node --check portal-extras.js
          node --check scripts/deploy-worker-safe.mjs
          node --check roles.js
          node --check attendance.js
          node --check tutorial.js
          node --test tests/school-roles-and-attendance.mjs
          node --test tests/school-floorplan.mjs
          node --test tests/rng-hotspots.mjs
          node --test tests/roster-lock-security.mjs
          node --test tests/live-readonly-identity-security-source.mjs
          node --test tests/portal-extras.mjs
          node --test tests/visa-gmail-dispatch.mjs
          node --check config.js
          node --test tests/v4-source-check.mjs
          node --test tests/v6-functional-source-check.mjs
          node --test tests/login-quota.mjs tests/sale-retry.mjs
          node --test tests/ui-navigation.mjs
          node --test tests/student-preview.mjs
          node --test tests/flag-design-assets.mjs
          node --test tests/currency-euro-disclosures.mjs
          node tests/self-signup-flow.mjs
          node scripts/build-worker.mjs
          node --check dist/schule-als-staat-worker.js
      - name: Verify static hosting bundle
        run: |
          sh scripts/build-static.sh
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/config.js
          test -s _site/styles.css
          test -s _site/features.js
          test -s _site/features.css
          test -s _site/physical-card-shop.css
          test -s _site/physical-card-shop.js
          test -s _site/shop-plan.js
          test -s _site/shop-plan.css
          test -s _site/mobile-ui.css
          test -s _site/portal-extras.js
          test -s _site/portal-extras.css
          test -s _site/public-visa.js
          test -s _site/public-visa.css
          test -s _site/roles.js
          test -s _site/attendance.js
          test -s _site/tutorial.js
          test -s _site/tutorial.css
          test ! -e _site/portal/index.html
      - name: Isolated PostgreSQL authorization regression
        run: bash tests/postgres/run.sh
      - name: Check browser dependency advisories
        working-directory: tests/dependencies
        run: npm audit --audit-level=high --ignore-scripts
      - name: Verify security migrations and shop rendering with synthetic fixtures
        run: |
          npm install --no-save --no-audit --no-fund @electric-sql/pglite@0.3.14 playwright@1.56.1
          node --test tests/sale-db.mjs
          CHROME_PATH="$(command -v google-chrome)" node --test tests/shop-inventory-browser.mjs
