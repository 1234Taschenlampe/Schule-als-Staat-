plugins { id 'com.android.application' }

android {
    namespace 'de.schulealsstaat.portal'
    compileSdk 36

    defaultConfig {
        applicationId 'de.schulealsstaat.portal'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-admin-preview'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
