QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {

		totalDataCount += rsBlocks[x].dataCount;
	}

		buffer.put(0, 4);
	}

	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}

    function validateInvoice(obj){return obj&&obj.v===1&&typeof obj.id==='string'&&obj.id.length<70&&typeof obj.shop==='string'&&obj.shop.length<=65&&typeof obj.item==='string'&&obj.item.length<=70&&Number.isSafeInteger(obj.cents)&&obj.cents>=1&&obj.cents<=100000&&typeof obj.created==='number'}
    function paymentText(inv){const code='SASONE-PAY:'+invoiceEncoded(inv);if(location.protocol==='https:'||location.protocol==='http:')return location.href.split('#')[0]+'#pay='+invoiceEncoded(inv);return code}
    function showPaymentCode(inv){let text=paymentText(inv);openModal('Zahlungs-QR · '+safe(inv.shop),`<div class="quiet-banner"><strong>Testzahlung:</strong> Schüler können den Code scannen. Eine echte Geldüberweisung ist nicht angeschlossen. Für Zahlungen zwischen Geräten muss die App online veröffentlicht werden.</div><div class="qr-sheet"><div class="qr-wrap">${qrSvg(text)}<p class="qr-explain">QR-Code mit Zahlungsdaten. Dieser Code ist technisch scannbar, aber kein GiroCode für eine Banküberweisung.</p></div><div class="qr-summary"><h3>${safe(inv.shop)}</h3><div class="pay-line"><span class="muted">Artikel / Zweck</span><strong>${safe(inv.item)}</strong></div><div class="pay-line"><span class="muted">Betrag</span><strong>${currency(inv.cents)}</strong></div><div class="pay-line"><span class="muted">Standort</span><strong>${safe(inv.room||'Digital')}</strong></div><div class="form-field"><label for="pay-sharelink">Code oder Link zum Teilen</label><textarea id="pay-sharelink" class="input payment-url" readonly>${safe(text)}</textarea></div><div class="pay-cta"><button class="btn btn-primary" data-action="copyPay">${icon('qr',16)} Link / Code kopieren</button><button class="btn btn-outline" data-action="payThis">Testzahlung ausführen</button></div><p class="subnote">Die Gutschrift beim Verkäufer kann in dieser Offline-Demo nicht zwischen zwei Geräten synchronisiert werden.</p></div></div>`,true);lastInvoice=inv;}
    function openQrPayment(ids){const items=[].concat(ids||[]).map(id=>catalog.find(p=>p.id===id)).filter(Boolean);if(!items.length)return;const sum=items.reduce((v,p)=>v+p.price,0);const spot=getSpot(items[0].spot);showPaymentCode(shopInvoice({id:spot?.id||'sas',name:spot?.name||'SaS Schulshop',room:spot?.room,item:items.map(x=>x.title).join(', ')},sum))}
    function openMyShopQR(id){const shop=(data.myShops||[]).find(s=>s.id===id);if(!shop){toast('Shop nicht gefunden.',true);return}showPaymentCode(shopInvoice(shop,shop.cents))}
    function payInvoice(inv){if(!validateInvoice(inv)){toast('Ungültiger Zahlungs-Code.',true);return}if(!Array.isArray(data.paidTokens))data.paidTokens=[];if(data.paidTokens.includes(inv.id)){toast('Diese Demo-Zahlung wurde bereits ausgeführt.',true);return}if(inv.cents>data.balance){toast('Zu wenig Demo-Guthaben.',true);return}data.balance-=inv.cents;data.paidTokens.push(inv.id);data.tx.unshift({id:makeId(),label:'Zahlung an '+inv.shop,desc:inv.item+' · QR-Demo',amount:-inv.cents,when:'Gerade eben'});store();closeModal();go('wallet');toast('Demo-Zahlung ausgeführt; keine echte Überweisung.');}
    function openInvoice(inv){if(!validateInvoice(inv)){toast('Ungültige Zahlungsdaten.',true);return}lastInvoice=inv;openModal('QR-Zahlung prüfen',`<div class="quiet-banner">Zahlungsanfrage aus einem SaS-Shop. Prüfe Betrag und Empfänger vor dem Bestätigen.</div><div class="pay-line"><span>Shop</span><strong>${safe(inv.shop)}</strong></div><div class="pay-line"><span>Artikel</span><strong>${safe(inv.item)}</strong></div><div class="pay-line"><span>Betrag</span><strong>${currency(inv.cents)}</strong></div><div class="pay-line"><span>Demo-Guthaben</span><strong>${currency(data.balance)}</strong></div><div class="pay-cta"><button class="btn btn-primary" data-action="payThis" ${data.balance<inv.cents?'disabled':''}>Mit Demo-Guthaben bezahlen</button><button class="btn btn-outline" data-action="close">Abbrechen</button></div><p class="subnote mt16">Zahlungen wirken nur in diesem Browser. Der Shop-Eigentümer bekommt keine echte Gutschrift.</p>`,true)}
    function parsePayment(code){const trimmed=String(code||'').trim();let encoded;if(trimmed.startsWith('SASONE-PAY:'))encoded=trimmed.slice(11);else if(trimmed.includes('#pay='))encoded=trimmed.split('#pay=')[1].split('&')[0];else encoded=trimmed;try{const inv=JSON.parse(fromBase64url(encoded));return validateInvoice(inv)?inv:null}catch{return null}}
    function scanPayment(){openModal('QR-Code bezahlen',`<p class="subnote">QR-Code mit der Handykamera scannen oder den Code hier einfügen. Auf einer gehosteten SaS-Website öffnet der QR-Link automatisch die Zahlungsseite.</p><form id="qrInputForm" class="stack mt16"><div class="form-field"><label for="qrInput">SaS-QR-Code / Zahlungslink</label><textarea class="input payment-url" name="code" id="qrInput" placeholder="SASONE-PAY:... oder https://.../#pay=..." required></textarea></div><button class="btn btn-primary">Zahlungsanfrage prüfen</button></form><div class="pay-cta"><button class="btn btn-outline" data-action="cameraScan">${icon('qr',16)} Kamera verwenden (falls unterstützt)</button></div><div id="scanZone"></div>`,true)}
    let lastInvoice=null,scannerStream=null,scannerLoopId=null;
    function stopScanner(){if(scannerLoopId)cancelAnimationFrame(scannerLoopId);scannerLoopId=null;if(scannerStream)scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}
    async function cameraScan(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia){toast('QR-Kamera auf diesem Browser nicht verfügbar. Code einfügen.',true);return}const z=$('scanZone');if(!z)return;try{scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});z.innerHTML='<video playsinline autoplay muted style="width:100%;max-height:280px;border-radius:8px;margin-top:15px"></video>';const video=z.querySelector('video');video.srcObject=scannerStream;await video.play();const scanner=new BarcodeDetector({formats:['qr_code']});let busy=false;const tick=async()=>{if(!scannerStream||!document.contains(video))return;if(!busy){busy=true;try{for(const detected of await scanner.detect(video)){const inv=parsePayment(detected.rawValue);if(inv){stopScanner();openInvoice(inv);return}}}catch{}busy=false}scannerLoopId=requestAnimationFrame(tick)};tick()}catch{stopScanner();toast('Kamera konnte nicht geöffnet werden.',true)}}
    function todayOffset(days){const d=new Date();d.setDate(d.getDate()+days);return d}

Beispielhafte Guthabenbewegungen</div></div></div></div><button class="btn btn-primary full mt24" data-page="shop">Zum Shop ${icon('arrow',17)}</button></section><section class="card"><div class="row gap8">${icon('lock',19)}<h3 style="margin:0">Sicherheit & Konzept</h3></div><p class="subnote mt16">Die Wallet ist ausschließlich eine lokale Simulation. Ein echtes Guthaben- oder Bank-System erfordert eine rechtliche Prüfung, sichere Zahlungsabwicklung und eine autorisierte Schnittstelle. Niemals echte Kontodaten in diese Demo eingeben.</p></section></aside></div>`}

    function shopPage(){const count=Object.values(data.cart).reduce((a,b)=>a+b,0);return `${intro('ALLES AUS EINER HAND','Digitaler SaS-Shop','Produkte auswählen, Standorte sehen und testweise per Wallet oder QR-Überweisung bezahlen.')}${demo}<div class="card mb20"><div class="card-header"><div><h2>Eigener Shop</h2><p>Verkaufsstand erstellen und Zahlungs-QR generieren</p></div><button class="btn btn-primary" data-action="createShop">${icon('plus',17)} Shop erstellen</button></div>${(data.myShops||[]).length?`<div>${data.myShops.map(s=>`<div class="listcard"><div><strong>${safe(s.name)}</strong><p>${safe(s.item)} · ${currency(s.cents)} · ${safe(s.room)}</p></div><div class="listcard-actions"><button class="btn btn-primary btn-sm" data-shop-qr="${safe(s.id)}">${icon('qr',15)} Zahlungs-QR</button><button class="btn btn-outline btn-sm" data-shop-room="${safe(s.room)}">${icon('map',15)} Karte</button><button class="btn btn-light btn-sm" data-shop-remove="${safe(s.id)}">Löschen</button></div></div>`).join('')}</div>`:`<p class="subnote" style="margin:0">Noch kein eigener Shop angelegt. Über „Shop erstellen“ legst du einen Stand mit einem Artikel und Preis an.</p>`}</div><section class="shop-directory">${shopSpots.map(s=>{const room=rooms.find(r=>r.id===s.room);return `<article class="room-card"><div class="row between gap8"><h3 style="margin:0">${s.name}</h3><span class="tag amber">${s.room}</span></div><div class="room-meta">${safe(s.type)} · ${s.floor==='0'?'EG':s.floor+'. OG'}</div><p class="small muted" style="margin:12px 0 0">${s.desc}</p><div class="shop-card-row"><span class="small muted">${productsForSpot(s.id).length} Artikel</span><button class="mini-link" data-shop-room="${s.room}">Im Plan öffnen ${icon('arrow',14)}</button></div></article>`}).join('')}</section><div class="row between gap12 wrap mb20"><div class="row gap8 wrap">${['Alle','Kleidung','Zubehör'].map(x=>`<button class="tab ${shopFilter===x?'active':''}" data-filter-shop="${x}">${x}</button>`).join('')}</div><button class="btn btn-outline" data-action="cart">${icon('bag',17)} Warenkorb <span class="cart-count">${count}</span></button></div><div class="product-grid">${catalog.filter(p=>shopFilter==='Alle'||(shopFilter==='Kleidung'?p.id==='hoodie':p.id!=='hoodie')).map(productCard).join('')}</div>`}
    function defaultBookingDate(){return dateISO(todayOffset(1))}
    function dateISO(d){const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,10)}
    function roomsPage(){return `${intro('RAUMVERWALTUNG','Raumreservierung','Freie Räume auswählen, Zeitfenster buchen und eigene Reservierungen verwalten.')}${demo}<div class="two-grid"><section class="card"><div class="card-header"><h2>Raum buchen</h2><span class="tag blue">${rooms.length} Demo-Räume</span></div><form id="bookingForm" class="stack"><div class="form-field"><label for="book-room">Raum auswählen</label><select class="select" id="book-room" name="room" required>${rooms.map(r=>`<option value="${r.id}" ${selectedRoom===r.id?'selected':''}>${r.id} · ${r.name} (${r.seats} Plätze)</option>`).join('')}</select></div><div class="form-grid"><div class="form-field"><label for="book-date">Datum</label><input class="input" type="date" id="book-date" name="date" min="${dateISO(new Date())}" value="${defaultBookingDate()}" required></div><div class="form-field"><label for="book-time">Zeitslot</label><select class="select" id="book-time" name="time"><option>08:00–09:00</option><option>09:00–10:00</option><option>10:00–11:00</option><option>11:00–12:00</option><option>13:00–14:00</option><option>14:00–15:00</option><option>15:00–16:00</option></select></div></div><div class="form-field"><label for="book-reason">Zweck</label><input class="input" id="book-reason" name="reason" placeholder="z. B. ViSA-Projekttreffen" maxlength="70" required></div><button type="submit" class="btn btn-primary">${icon('check',18)} Reservierung anlegen</button></form><p class="subnote mt16">Kollisionen mit eigenen Demo-Reservierungen werden geprüft. Eine echte Raumverwaltung braucht Benutzerrechte, Kalender und Freigabeprozesse.</p></section><section class="card"><div class="card-header"><h2>Meine Reservierungen</h2><span class="tag">${data.reservations.length} aktiv</span></div>${data.reservations.length?data.reservations.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>`<div class="booking"><span class="quick-icon">${icon('calendar')}</span><div class="booking-main"><strong>${safe(x.room)} · ${safe(rooms.find(r=>r.id===x.room)?.name||'Raum')}</strong><span>${safe(x.date.split('-').reverse().join('.'))} · ${safe(x.time)}<br>${safe(x.reason)}</span></div><button class="btn btn-outline btn-sm" data-cancel-book="${safe(x.id)}">Stornieren</button></div>`).join(''):`<div class="empty">Noch keine Reservierungen. Wähle links einen Raum aus.</div>`}<button class="btn btn-light full mt20" data-page="map">${icon('map',16)} Räume auf dem Schulplan finden</button></section></div><section class="card mt20"><div class="card-header"><h2>Raumübersicht</h2><span class="tag">Beispielräume</span></div><div class="rooms-grid">${rooms.map(r=>`<div class="room-card"><div class="row between"><h3>${r.id} · ${r.name}</h3><span class="tag green">Demo</span></div><div class="room-meta">${r.seats} Plätze · ${r.type} · ${r.floor==='0'?'EG':r.floor+'. OG'}</div><button class="mini-link" data-room-link="${r.id}">Auf dem Plan ansehen ${icon('arrow',14)}</button></div>`).join('')}</div></section>`}
    function mapPage(){const current=rooms.filter(r=>r.floor===selectedFloor),r=rooms.find(r=>r.id===selectedRoom)||rooms[0],spotsHere=[...shopSpots.filter(s=>s.floor===selectedFloor),...(data.myShops||[]).filter(s=>rooms.find(r=>r.id===s.room)?.floor===selectedFloor).map(s=>({...s,type:s.item,desc:`${currency(s.cents)} · eigener Shop`}))],spotsInRoom=[...shopSpots.filter(s=>s.room===r.id),...(data.myShops||[]).filter(s=>s.room===r.id).map(s=>({...s,type:s.item,desc:`${currency(s.cents)} · eigener Shop`}))];return `${intro('DIGITALE ORIENTIERUNG','Interaktiver Schulplan','Etage auswählen, Raum anklicken und Shop-Standorte direkt im Plan sehen.')}${demo}<div class="map-layout"><section class="card"><div class="card-header"><h2>Gebäudeübersicht</h2><span class="tag">Schematischer Demo-Plan</span></div><div class="floor-tabs mb20">${[['0','Erdgeschoss'],['1','1. Obergeschoss'],['2','2. Obergeschoss']].map(([id,name])=>`<button class="tab ${selectedFloor===id?'active':''}" data-floor="${id}">${name}</button>`).join('')}</div><div class="floorboard"><div class="plan-label">${selectedFloor==='0'?'Erdgeschoss':selectedFloor+'. Obergeschoss'} · Gebäudeplan</div><div class="floor-layout">${[0,1,2].map(i=>{const rr=i===0?current[0]:null;const placeholders=['Treppenhaus','Weitere Räume','Infopunkt'];return rr?`<button class="floor-room ${selectedRoom===rr.id?'active':''}" data-select-room="${rr.id}">${icon('door',19)}<span>${rr.id}</span><small>${rr.name}</small><span class="qrpin" title="QR-Standort (Konzept)">${icon('qr',12)}</span>${(data.myShops||[]).some(s=>s.room===rr.id)||shopSpots.some(s=>s.room===rr.id)?`<span class="map-shop-token">SHOP · ${shopSpots.filter(s=>s.room===rr.id).length+(data.myShops||[]).filter(s=>s.room===rr.id).length}</span>`:``}</button>`:`<div class="floor-room static">${icon('door',17)}<small>${placeholders[i]}</small></div>`}).join('')}<div class="corridor">Flur / QR-Wegweiser</div>${[0,1,2].map(i=>{const rr=i===1?current[1]:null;const placeholders=['Flurzone','Weitere Räume','Nebenraum'];return rr?`<button class="floor-room ${selectedRoom===rr.id?'active':''}" data-select-room="${rr.id}">${icon('door',19)}<span>${rr.id}</span><small>${rr.name}</small><span class="qrpin" title="QR-Standort (Konzept)">${icon('qr',12)}</span>${(data.myShops||[]).some(s=>s.room===rr.id)||shopSpots.some(s=>s.room===rr.id)?`<span class="map-shop-token">SHOP · ${shopSpots.filter(s=>s.room===rr.id).length+(data.myShops||[]).filter(s=>s.room===rr.id).length}</span>`:``}</button>`:`<div class="floor-room static">${icon('door',17)}<small>${placeholders[i]}</small></div>`}).join('')}</div><div class="map-cluster"><div class="plan-label">Shop-Standorte auf dieser Etage</div><div class="shop-map-grid">${spotsHere.length?spotsHere.map(s=>`<button class="shop-spot" data-shop-room="${s.room}"><div class="shop-spot-top"><span class="location-chip">${icon('shop',14)} ${s.name}</span><span class="shop-flag">${s.room}</span></div><h3>${s.type}</h3><p>${s.desc}</p></button>`).join(''):`<div class="empty">Auf dieser Etage ist aktuell kein Shop-Standort eingetragen.</div>`}</div></div><div class="plan-note">${icon('qr',16)} QR-Symbole markieren mögliche Standorte für spätere Hinweisschilder. Shop-Karten unten sind anklickbar.</div></div><p class="subnote mt16">Dieser Gebäudeplan ist frei erfunden. Für den realen Einsatz werden genehmigte Grundrisse, richtige Raumpositionen und funktionierende QR-Links benötigt.</p></section><aside class="card"><div class="card-header"><h2>Raumdetails</h2><span class="tag blue">Ausgewählt</span></div><div class="room-details"><div class="row gap8">${icon('pin',20)} <strong style="font-size:22px">${r.id}</strong></div><h2 class="mt16">${r.name}</h2><p class="muted small mt16">${r.desc}</p><div class="line"></div><div class="info-row"><span class="muted">Etage</span><strong>${r.floor==='0'?'Erdgeschoss':r.floor+'. Obergeschoss'}</strong></div><div class="info-row"><span class="muted">Kapazität</span><strong>${r.seats} Plätze</strong></div><div class="info-row"><span class="muted">Raumtyp</span><strong>${r.type}</strong></div></div>${spotsInRoom.length?`<div class="shop-sidecard">${spotsInRoom.map(s=>`<button class="shop-spot" data-page="shop"><div class="shop-spot-top"><span class="location-chip">${icon('shop',14)} ${s.name}</span><span class="shop-flag">Shop</span></div><h3>${s.type}</h3><p>${(productsForSpot(s.id).map(p=>p.title).join(' · ')||s.desc)}</p></button>`).join('')}</div>`:''}<button class="btn btn-primary full mt20" data-book-from-map="${r.id}">${icon('calendar',18)} Diesen Raum buchen</button><button class="btn btn-outline full mt16" data-action="roomlink">${icon('qr',18)} Link zum Raum kopieren</button><p class="subnote mt16">Bei Räumen mit Shop-Standort kannst du direkt in den Shop wechseln oder den QR-Bezahlfluss im Shop öffnen.</p></aside></div>`}
    function newsPage(){return `${intro('SCHULLEBEN','Digitales Schwarzes Brett','Meldungen aus Moodle, Instagram und der Schulwebsite in einer Übersicht.')}${demo}<div class="two-grid"><section class="card"><div class="card-header"><h2>Aktuelle Beiträge</h2><span class="tag">${postings.length} Demo-Beiträge</span></div>${postings.map(p=>`<article class="feed-item"><div class="feed-icon">${icon(p.type==='Moodle'?'book':p.type==='Instagram'?'users':'news',20)}</div><div class="grow"><div class="row gap8 wrap" style="margin-bottom:8px"><span class="tag blue">${p.type}</span><span class="small muted">${p.time}</span></div><h3 style="font-size:16px">${p.title}</h3><p style="font-size:13px">${p.desc}</p></div></article>`).join('')}</section><aside class="card"><h2>Ein System statt vieler Kanäle</h2><p class="muted mt16">Das SaS-Portal zeigt Schulneuigkeiten an einem Ort. Die jeweiligen Originalsysteme können für redaktionelle Arbeit bestehen bleiben.</p><div class="line"></div><div class="row gap12">${icon('book',20)} <div><strong>Moodle</strong><div class="small muted">Informationen und Umfragen</div></div></div><div class="row gap12 mt20">${icon('users',20)} <div><strong>Instagram</strong><div class="small muted">Öffentlichkeitsarbeit und Community</div></div></div><div class="row gap12 mt20">${icon('news',20)} <div><strong>Schulwebsite</strong><div class="small muted">Offizielle und dauerhaft abrufbare Inhalte</div></div></div></aside></div>`}
    function eventsPage(){return `${intro('WAS ANSTEHT','Veranstaltungskalender','Schul- und SaS-Termine zentral sehen und Demo-Teilnahmen vormerken.')}${demo}<div class="two-grid"><section class="card"><div class="card-header"><h2>Nächste Veranstaltungen</h2><span class="tag blue">${eventList.length} Termine</span></div>${eventList.map(e=>{const d=todayOffset(e.offset),att=data.attending.includes(e.id);return `<article class="event-card"><div class="event-date"><strong>${day(d)}</strong><span>${month(d)}</span></div><div class="grow"><h3 style="font-size:15px">${e.title}</h3><div class="small muted">${dateLong(d)} · ${e.time} Uhr</div><div class="small muted">${e.where}</div><div class="small mt16">${e.desc}</div></div><button class="btn btn-sm ${att?'btn-light':'btn-primary'}" data-event="${e.id}">${att?icon('check',15):icon('plus',15)} ${att?'Vorgemerkt':'Vormerken'}</button></article>`}).join('')}</section><aside class="card"><h2>Deine Vormerkungen</h2><p class="subnote mt16">Vormerkungen werden ausschließlich lokal in deinem Browser gespeichert.</p>${data.attending.length?data.attending.map(id=>{const e=eventList.find(x=>x.id===id);return e?`<div class="booking"><span class="quick-icon">${icon('check')}</span><div class="booking-main"><strong>${e.title}</strong><span>${dateShort(todayOffset(e.offset))}</span></div></div>`:''}).join(''):`<div class="empty mt20">Du hast noch keine Veranstaltung vorgemerkt.</div>`}</aside></div>`}
    function foundPage(){const f=objects.filter(x=>foundFilter==='Alle'||x.cat===foundFilter);return `${intro('GESUCHT & GEFUNDEN','Digitales Fundbüro','Fundgegenstände finden und herausbekommen, wo sie abgeholt werden können.')}${demo}<div class="row gap8 wrap mb20">${['Alle','Alltag','Technik','Schlüssel','Schule'].map(x=>`<button class="tab ${foundFilter===x?'active':''}" data-found-filter="${x}">${x}</button>`).join('')}</div><div class="found-grid">${f.map(x=>`<article class="found-card card"><span class="found-icon">${icon(x.icon,27)}</span><div class="grow"><span class="tag">${x.cat}</span><h3 class="mt16">${x.title}</h3><div class="small muted">Gefunden: ${x.where} · ${x.date}</div><button class="mini-link mt16" data-found-item="${x.id}">Abholung anfragen ${icon('arrow',14)}</button></div></article>`).join('')}</div><div class="card mt20"><h2>Fundstück melden</h2><p class="subnote mt16">In der echten Version können Fundstücke über ein Formular gemeldet und nach Prüfung veröffentlicht werden. Öffentliche Posts zeigen keine Namen, Adressen oder identifizierenden Daten.</p><button class="btn btn-outline" data-action="reportFound">${icon('plus',17)} Fund melden (Konzept)</button></div>`}
    function pollsPage(){return `${intro('DEINE STIMME','Digitale Umfragen','Einfaches Feedbacksystem, das später an Moodle angebunden werden kann.')}${demo}<div class="two-grid">${polls.map(p=>{const pick=data.votes[p.id],total=p.votes.reduce((a,b)=>a+b,0)+(pick===undefined?0:1);return `<section class="card"><span class="tag blue">Moodle-Integration geplant</span><h2 class="mt16">${p.title}</h2><p class="small muted mt16">${p.desc}</p><div class="mt20">${p.choices.map((name,i)=>{const n=p.votes[i]+(pick===i?1:0),percent=Math.round(n/total*100);return pick===undefined?`<button class="poll-choice" data-vote="${p.id}" data-choice="${i}"><span>${name}</span>${icon('chevron',16)}</button>`:`<div style="margin-top:15px"><div class="row between gap8"><span class="small b">${name} ${pick===i?'· Deine Wahl':''}</span><strong class="small">${percent}%</strong></div><div class="poll-meter"><i style="width:${percent}%"></i></div></div>`}).join('')}</div><div class="small muted mt20">${total} simulierte Stimmen · ${pick===undefined?'Eine Auswahl möglich':'Deine Stimme wurde lokal gespeichert'}</div></section>`}).join('')}</div>`}
    function visaPage(){return `${intro('ViSA / AUFNAHME','ViSA-Onboarding','Angaben für die Anmeldung und Orientierung – als Formular statt Checkliste.')}${demo}<div class="two-grid"><section class="card"><div class="card-header"><div><h2>Persönliche Angaben</h2><p>Vorbereitung eines späteren Aufnahmeformulars</p></div><span class="tag green">Formular</span></div><div class="quiet-banner">Bitte für diesen öffentlichen Prototyp nur Testdaten verwenden. Angaben werden weder verschickt noch dauerhaft gespeichert.</div><form id="visaForm" class="stack"><div class="form-caption">01 / Person</div><div class="form-grid-2"><div class="form-field"><label for="visa-first">Vorname *</label><input class="input" id="visa-first" name="first" maxlength="60" autocomplete="given-name" required placeholder="Vorname"></div><div class="form-field"><label for="visa-last">Nachname *</label><input class="input" id="visa-last" name="last" maxlength="60" autocomplete="family-name" required placeholder="Nachname"></div><div class="form-field"><label for="visa-country">Heimatland *</label><input class="input" id="visa-country" name="country" maxlength="70" autocomplete="country-name" required placeholder="z. B. Deutschland"></div><div class="form-field"><label for="visa-lang">Bevorzugte Sprache</label><select class="select" id="visa-lang" name="lang"><option>Deutsch</option><option>Englisch</option><option>Französisch</option><option>Andere</option></select></div></div><div class="form-caption">02 / Heim und Anschrift</div><div class="form-grid-2"><div class="form-field"><label for="visa-home">Heim / Unterkunft (optional)</label><input class="input" id="visa-home" name="home" maxlength="100" placeholder="z. B. Wohnheim, Internat"></div><div class="form-field"><label for="visa-street">Straße und Hausnummer *</label><input class="input" id="visa-street" name="street" maxlength="120" autocomplete="street-address" required placeholder="Musterstraße 12"></div><div class="form-field"><label for="visa-zip">Postleitzahl *</label><input class="input" id="visa-zip" name="zip" maxlength="14" autocomplete="postal-code" required placeholder="PLZ"></div><div class="form-field"><label for="visa-city">Ort *</label><input class="input" id="visa-city" name="city" maxlength="90" autocomplete="address-level2" required placeholder="Wohnort"></div></div><div class="form-caption">03 / Schule und Kontakt</div><div class="form-grid-2"><div class="form-field"><label for="visa-school">Schule / Klasse</label><input class="input" id="visa-school" name="school" maxlength="90" placeholder="z. B. Klasse 10A"></div><div class="form-field"><label for="visa-date">Eintritt / Ankunft</label><input class="input" id="visa-date" name="arrival" type="date"></div><div class="form-field field-wide"><label for="visa-mail">Kontakt-E-Mail (optional)</label><input class="input" id="visa-mail" name="email" type="email" maxlength="120" autocomplete="email" placeholder="name@beispiel.de"></div></div><div class="row gap8 wrap"><button class="btn btn-primary" type="submit">Angaben prüfen</button><button class="btn btn-outline" type="reset" data-action="visaClear">Formular leeren</button></div></form><div id="visaPreviewBox">${visaPreview?visaPreviewMarkup():''}</div></section><aside class="stack"><section class="card"><h2>Was passiert als Nächstes?</h2><div class="listcard"><div><strong>01 · Angaben erfassen</strong><p>Persönliche Daten und Unterkunft werden erfasst.</p></div></div><div class="listcard"><div><strong>02 · Daten prüfen</strong><p>Eine Zusammenfassung zeigt die Eingaben an.</p></div></div><div class="listcard"><div><strong>03 · Spätere Freigabe</strong><p>Eine echte Anmeldung benötigt eine sichere Serveranbindung und Zugriffsrechte.</p></div></div></section><section class="card"><h3>Datenschutz</h3><p class="subnote">Adressen und Kontaktdaten sind sensible Schülerdaten. In dieser Demo bleibt die Vorschau nur im Arbeitsspeicher bis zum Neuladen. Für einen späteren Betrieb: Einwilligungen/gesetzliche Grundlage, Zugriffsschutz, Verschlüsselung bei Transport und Speicherung, Löschkonzept.</p></section></aside></div>`}
    function visaPreviewMarkup(){if(!visaPreview)return '';const p=visaPreview;const lines=[['Name',p.first+' '+p.last],['Heimatland',p.country],['Heim / Unterkunft',p.home||'–'],['Adresse',p.street+', '+p.zip+' '+p.city],['Sprache',p.lang],['Schule / Klasse',p.school||'–'],['Eintritt',p.arrival||'–'],['E-Mail',p.email||'–']];return `<div class="preview-card"><h3>Vorschau deiner Angaben</h3>${lines.map(([k,v])=>`<div class="preview-kv"><span>${safe(k)}</span><strong>${safe(v)}</strong></div>`).join('')}<p class="subnote mt16">Diese Daten wurden nicht an die Schule übertragen. Neuladen löscht die Vorschau.</p></div>`}
    function profilePage(){return `${intro('EINSTELLUNGEN','Mein Demo-Profil','Accountdaten, Portal-Konzept und Testfunktionen.')}${demo}<div class="two-grid"><section class="card"><div class="row gap16"><span class="avatar" style="height:62px;width:62px;font-size:21px">AM</span><div><h2 style="font-size:21px">Alex Muster</h2><p class="muted small" style="margin:2px 0">Fiktiver Schüler · Klasse 10A</p><span class="tag blue">DEMO-ZUGANG</span></div></div><div class="line"></div><div class="info-row"><span class="muted">Name</span><strong>Alex Muster (Beispielperson)</strong></div><div class="info-row"><span class="muted">Rolle</span><strong>Schüler</strong></div><div class="info-row"><span class="muted">Schule</span><strong>Beispielschule</strong></div><div class="info-row"><span class="muted">Verbindung</span><strong>Offline-Demo</strong></div><button class="btn btn-outline mt24" data-action="reset">${icon('logout',17)} Demo-Daten zurücksetzen</button></section><aside class="card"><h2>Zum Prototyp</h2><p class="muted mt16">SaS ONE demonstriert, wie mehrere digitale Schulangebote unter einer gemeinsamen Oberfläche funktionieren könnten.</p><div class="line"></div><div class="info-row"><span class="muted">Frontend</span><strong>HTML · CSS · JavaScript</strong></div><div class="info-row"><span class="muted">Datenspeicherung</span><strong>Lokal im Browser</strong></div><div class="info-row"><span class="muted">Zahlungen</span><strong>Nur Simulation</strong></div><div class="info-row"><span class="muted">Anbindungen</span><strong>Noch keine APIs</strong></div><p class="subnote mt20">Für den Produktivbetrieb erforderlich: Hosting, Authentifizierung, Rollenmodell, Datenschutzprüfung, API-Anbindungen und serverseitige Buchungs- und Zahlungslogik.</p></aside></div>`}
    function openModal(title,body,wide=false){$('modalRoot').innerHTML=`<div class="overlay" data-dismiss="1"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="modal-head"><h2 id="dialogTitle">${title}</h2><button class="modal-close" data-action="close" aria-label="Schließen">${icon('close',19)}</button></div>${body}</div></div>`;const f=$('modalRoot').querySelector('input,button');f?.focus()}
    function closeModal(){stopScanner();$('modalRoot').innerHTML=''}
    function toast(msg,error=false){const div=document.createElement('div');div.className='toast'+(error?' error':'');div.innerHTML=`${icon(error?'info':'check',18)}<span>${safe(msg)}</span>`;$('toastArea').appendChild(div);setTimeout(()=>div.remove(),3200)}
    function newShopForm(){openModal('Eigenen Shop erstellen',`<p class="subnote">Lege einen Demo-Shop mit festem Artikelpreis an. Der Shop erscheint im Schulplan am gewählten Raum.</p><form id="createShopForm" class="stack"><div class="form-grid-2"><div class="form-field"><label for="shop-name">Shopname *</label><input id="shop-name" name="name" class="input" maxlength="55" placeholder="z. B. Kuchenverkauf 10A" required></div><div class="form-field"><label for="shop-room">Standort / Raum *</label><select id="shop-room" name="room" class="select" required>${rooms.map(r=>`<option value="${r.id}">${r.id} · ${r.name}</option>`).join('')}</select></div><div class="form-field"><label for="shop-item">Artikel / Zweck *</label><input id="shop-item" name="item" class="input" maxlength="60" placeholder="z. B. Stück Kuchen" required></div><div class="form-field"><label for="shop-price">Preis in Euro *</label><input id="shop-price" name="price" class="input" type="number" min="0.01" max="1000" step="0.01" placeholder="2.50" required></div></div><div class="form-field"><label for="shop-desc">Kurzbeschreibung (optional)</label><input id="shop-desc" name="desc" class="input" maxlength="125" placeholder="z. B. Verkauf in der großen Pause"></div><button class="btn btn-primary" type="submit">Shop speichern und QR-Code erstellen</button></form>`,true)}
    function cartModal(){const items=catalog.filter(p=>data.cart[p.id]>0),sum=items.reduce((s,p)=>s+p.price*data.cart[p.id],0),expanded=items.flatMap(p=>Array.from({length:data.cart[p.id]},()=>p.id));openModal('Dein Warenkorb',items.length?`<div>${items.map(p=>`<div class="tx"><div class="tx-ico">${icon(p.icon,22)}</div><div class="grow"><div class="tx-name">${p.title}</div><div class="tx-time">${currency(p.price)} je Stück</div></div><div class="row gap8"><button class="btn btn-light btn-sm" data-cart-remove="${p.id}" aria-label="Ein Stück entfernen">−</button><strong>${data.cart[p.id]}</strong><button class="btn btn-light btn-sm" data-add-cart="${p.id}" aria-label="Ein Stück hinzufügen">+</button></div></div>`).join('')}</div><div class="line"></div><div class="row between"><span>Gesamtbetrag</span><strong style="font-size:22px">${currency(sum)}</strong></div><p class="small muted mt16">Demo-Guthaben: ${currency(data.balance)}</p><div class="pay-cta"><button class="btn btn-primary grow" data-action="checkout" ${sum>data.balance?'disabled':''}>${icon('wallet',17)} Mit Demo-Guthaben bezahlen</button><button class="btn btn-outline grow" data-cart-qr="${safe(expanded.join(','))}">${icon('qr',16)} Shop-QR / Demo-Zahlung</button></div>${sum>data.balance?'<p class="small" style="color:#9f4040;margin:10px 0">Nicht genug Demo-Guthaben. Alternativ lässt sich der Überweisungs-QR anzeigen.</p>':''}`:`<div class="empty">Dein Warenkorb ist noch leer.</div><button class="btn btn-primary full mt20" data-action="close">Weiter einkaufen</button>`)}
    function topup(){data.balance+=1000;data.tx.unshift({id:makeId(),label:'Demo-Guthaben ergänzt',desc:'Keine reale Einzahlung',amount:1000,when:'Gerade eben'});store();go('wallet');toast('10 € Demo-Guthaben hinzugefügt.')}
    function makeId(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
    function showTransfer(){openModal('Demo-Überweisung',`<p class="subnote">Dies ist eine rein lokale Simulation. Es wird niemandem echtes Geld gesendet.</p><form id="transferForm" class="stack"><div class="form-field"><label for="transfer-to">Empfänger (Beispielperson)</label><select name="to" id="transfer-to" class="select"><option>Jamie Keller</option><option>Mila Sommer</option><option>SaS Projektteam</option></select></div><div class="form-field"><label for="transfer-amount">Betrag in Euro</label><input id="transfer-amount" name="amount" class="input" type="number" min="0.01" step="0.01" max="${(data.balance/100).toFixed(2)}" placeholder="5,00" required></div><button class="btn btn-primary" type="submit">${icon('transfer',17)} Demo-Überweisung ausführen</button></form>`)}
    function menuModal(){openModal('Alle Funktionen',`<div class="quick-grid">${navGroups.flatMap(([,items])=>items).map(([id,label,ico])=>quickBtn(id,label,ico)).join('')}</div>`,true)}
    function searchModal(){openModal('SaS ONE durchsuchen',`<div class="form-field"><label for="globalSearch">Suche nach Funktionen oder Räumen</label><input class="input" autofocus id="globalSearch" placeholder="z. B. Wallet, Medienraum, Ausweis" autocomplete="off"></div><div class="search-results" id="searchResults"></div>`,true);renderSearch('');$('globalSearch').focus()}
    function renderSearch(q){const pages=navGroups.flatMap(([,items])=>items).map(([id,title,ico])=>({type:'page',id,title,ico,sub:'Funktion'})),rr=rooms.map(r=>({type:'room',id:r.id,title:`${r.id} · ${r.name}`,ico:'door',sub:'Raum im Schulplan'})),ss=shopSpots.map(s=>({type:'spot',id:s.room,title:`${s.name} · ${s.room}`,ico:'shop',sub:'Shop-Standort'}));const res=[...pages,...rr,...ss].filter(x=>(x.title+' '+x.sub).toLowerCase().includes(q.toLowerCase())).slice(0,14);$('searchResults').innerHTML=res.length?res.map(x=>`<button class="search-item" ${x.type==='page'?`data-page="${x.id}"`:`data-room-link="${x.id}"`}>${icon(x.ico,19)}<span class="grow"><strong>${x.title}</strong><span class="small muted" style="display:block">${x.sub}</span></span>${icon('chevron',16)}</button>`).join(''):'<div class="empty">Keine Ergebnisse gefunden.</div>'}
    function notificationModal(){openModal('Hinweise',`<div class="feed-item"><span class="feed-icon">${icon('info')}</span><div><h3>Willkommen bei SaS ONE</h3><p>Dieser Prototyp enthält ausschließlich fiktive Informationen und simulierte Dienste.</p></div></div><div class="feed-item"><span class="feed-icon">${icon('calendar')}</span><div><h3>Nächstes Demo-Projekttreffen</h3><p>${dateLong(todayOffset(3))} · 14:30 Uhr</p></div></div>`)}
    function foundItem(id){const x=objects.find(y=>y.id===id);if(x)openModal('Abholung anfragen',`<div class="row gap12 mb20"><span class="found-icon">${icon(x.icon,25)}</span><div><h3>${x.title}</h3><div class="small muted">Fundort: ${x.where}</div></div></div><p class="subnote">Im echten Portal könnte hier eine Anfrage an das zuständige Fundbüro verschickt werden. Dieser Prototyp sendet keine Nachrichten und erfasst keine Kontaktdaten.</p><button class="btn btn-primary full mt20" data-action="close">Verstanden</button>`)}
    function openFoundForm(){openModal('Fundstück melden · Demo',`<p class="subnote">Diese Eingabe zeigt nur die geplante Bedienung. Eine Meldung wird nicht veröffentlicht und nicht an die Schule gesendet.</p><form id="foundForm" class="stack"><div class="form-field"><label for="foundName">Gegenstand</label><input class="input" id="foundName" name="item" maxlength="70" required placeholder="z. B. Schwarze Jacke"></div><div class="form-field"><label for="foundPlace">Fundort</label><input class="input" id="foundPlace" name="place" maxlength="70" required placeholder="z. B. Schulhof"></div><button class="btn btn-primary">Demo-Meldung absenden</button></form>`)}
    function resetModal(){openModal('Demo zurücksetzen?',`<p>Alle lokal gespeicherten Demo-Transaktionen, Shopartikel, Reservierungen, Umfragen und Onboarding-Schritte werden gelöscht.</p><div class="row gap8 mt24"><button class="btn btn-outline grow" data-action="close">Abbrechen</button><button class="btn btn-dark grow" data-action="confirmReset">Zurücksetzen</button></div>`)}
    function handleClick(e){const element=e.target.closest('button,[data-dismiss]');if(!element)return;if(element.hasAttribute('data-dismiss')&&e.target===element){closeModal();return}const page=element.dataset.page;if(page){closeModal();go(page);return}const action=element.dataset.action;if(action){switch(action){case'close':closeModal();break;case'menu':menuModal();break;case'search':searchModal();break;case'notifications':notificationModal();break;case'topup':topup();break;case'transfer':showTransfer();break;case'cart':cartModal();break;case'createShop':newShopForm();break;case'scanPay':scanPayment();break;case'cameraScan':cameraScan();break;case'copyPay':{const field=$('pay-sharelink');if(field){const v=field.value;field.select();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(v).then(()=>toast('Link kopiert.')).catch(()=>toast('Bitte Text manuell kopieren.'))}else{try{document.execCommand('copy');toast('Link kopiert.')}catch{toast('Bitte Text manuell kopieren.')}}}break}case'payThis':{if(lastInvoice)payInvoice(lastInvoice);break}case'visaClear':{visaPreview=null;const preview=$('visaPreviewBox');if(preview)preview.innerHTML='';break}case'checkout':{const items=catalog.filter(p=>data.cart[p.id]>0),sum=items.reduce((s,p)=>s+p.price*data.cart[p.id],0);if(!items.length||sum>data.balance){toast('Bezahlung nicht möglich.',true);return}data.balance-=sum;data.tx.unshift({id:makeId(),label:'SaS-Shop · Demo-Bestellung',desc:`${items.reduce((s,p)=>s+data.cart[p.id],0)} Artikel · keine echte Bestellung`,amount:-sum,when:'Gerade eben'});data.cart={};store();closeModal();go('shop');toast('Demo-Kauf abgeschlossen. Es wurde nichts bestellt.');break}case'roomlink':{const url=location.href.split('#')[0]+'#room='+selectedRoom;copyText(url);break}case'reportFound':openFoundForm();break;case'reset':resetModal();break;case'confirmReset':data=JSON.parse(JSON.stringify(initial));visaPreview=null;store();closeModal();go('home');toast('Demo-Daten zurückgesetzt.');break}return}
      if(element.dataset.addCart){const id=element.dataset.addCart;data.cart[id]=(data.cart[id]||0)+1;store();if($('modalRoot').children.length&&$('modalRoot').textContent.includes('Warenkorb'))cartModal();else go('shop');toast('Artikel zum Warenkorb hinzugefügt.');return}
      if(element.dataset.cartRemove){const id=element.dataset.cartRemove;if(data.cart[id])data.cart[id]--;if(data.cart[id]<=0)delete data.cart[id];store();cartModal();return}
      if(element.dataset.shopQr){openMyShopQR(element.dataset.shopQr);return}
      if(element.dataset.shopRemove){data.myShops=(data.myShops||[]).filter(x=>x.id!==element.dataset.shopRemove);store();go('shop');toast('Shop gelöscht.');return}
      if(element.dataset.cartQr){openQrPayment(String(element.dataset.cartQr).split(',').filter(Boolean));return}
      if(element.dataset.qrPay){openQrPayment([element.dataset.qrPay]);return}
      if(element.dataset.shopRoom){const room=rooms.find(r=>r.id===element.dataset.shopRoom);if(room){selectedRoom=room.id;selectedFloor=room.floor;go('map')}return}
      if(element.dataset.filterShop){shopFilter=element.dataset.filterShop;go('shop');return}
      if(element.dataset.foundFilter){foundFilter=element.dataset.foundFilter;go('found');return}
      if(element.dataset.foundItem){foundItem(Number(element.dataset.foundItem));return}
      if(element.dataset.floor){selectedFloor=element.dataset.floor;const cur=rooms.find(r=>r.floor===selectedFloor);selectedRoom=cur?.id||selectedRoom;go('map');return}
      if(element.dataset.selectRoom){selectedRoom=element.dataset.selectRoom;go('map');return}
      if(element.dataset.roomLink){const room=rooms.find(r=>r.id===element.dataset.roomLink);if(room){selectedRoom=room.id;selectedFloor=room.floor;closeModal();go('map')}return}
      if(element.dataset.bookFromMap){selectedRoom=element.dataset.bookFromMap;go('rooms');return}
      if(element.dataset.cancelBook){data.reservations=data.reservations.filter(x=>x.id!==element.dataset.cancelBook);store();go('rooms');toast('Demo-Reservierung storniert.');return}
      if(element.dataset.event){const id=element.dataset.event;if(data.attending.includes(id))data.attending=data.attending.filter(x=>x!==id);else data.attending.push(id);store();go('events');toast(data.attending.includes(id)?'Teilnahme lokal vorgemerkt.':'Vormerkung entfernt.');return}
      if(element.dataset.vote){const id=element.dataset.vote;if(data.votes[id]!==undefined)return;data.votes[id]=Number(element.dataset.choice);store();go('polls');toast('Demo-Stimme gespeichert.');return}
      if(element.dataset.step){const id=element.dataset.step;if(data.onboarding.includes(id))data.onboarding=data.onboarding.filter(x=>x!==id);else data.onboarding.push(id);store();go('visa');return}
    }
    async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(t);else{const inp=document.createElement('textarea');inp.value=t;document.body.appendChild(inp);inp.select();if(!document.execCommand('copy'))throw Error('not copied');inp.remove()}toast('Raumlink kopiert.')}catch{openModal('Raumlink',`<p class="subnote">Kopiere den Link manuell:</p><input class="input" readonly value="${safe(t)}" onfocus="this.select()">`)}}
    function handleSubmit(e){if(!e.target.matches('form'))return;e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='createShopForm'){const name=String(fd.get('name')||'').trim(),room=String(fd.get('room')||''),item=String(fd.get('item')||'').trim(),amount=Number(fd.get('price')),desc=String(fd.get('desc')||'').trim(),cents=Math.round(amount*100);if(!name||!item||!rooms.some(r=>r.id===room)||!Number.isFinite(amount)||cents<1||cents>100000){toast('Bitte gültige Shopdaten eingeben.',true);return}const shop={id:makeId(),name,room,item,cents,desc};if(!Array.isArray(data.myShops))data.myShops=[];data.myShops.push(shop);store();go('shop');showPaymentCode(shopInvoice(shop,cents));return}
      if(f.id==='qrInputForm'){const inv=parsePayment(fd.get('code'));if(!inv){toast('Dieser QR-Code enthält keine gültige SaS-Zahlungsanfrage.',true);return}stopScanner();openInvoice(inv);return}
      if(f.id==='visaForm'){const keys=['first','last','country','lang','home','street','zip','city','school','arrival','email'];const p=Object.fromEntries(keys.map(k=>[k,String(fd.get(k)||'').trim()]));if(!p.first||!p.last||!p.country||!p.street||!p.zip||!p.city){toast('Bitte alle Pflichtfelder ausfüllen.',true);return}visaPreview=p;const el=$('visaPreviewBox');if(el)el.innerHTML=visaPreviewMarkup();el?.scrollIntoView({block:'nearest',behavior:'smooth'});toast('Vorschau erstellt – nichts versendet.');return}
      if(f.id==='bookingForm'){
      const room=String(fd.get('room')),date=String(fd.get('date')),time=String(fd.get('time')),reason=String(fd.get('reason')).trim();if(!rooms.some(x=>x.id===room)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<dateISO(new Date())||!reason){toast('Bitte gültige Buchungsdaten eingeben.',true);return}
      if(data.reservations.some(x=>x.room===room&&x.date===date&&x.time===time)){toast('Für diesen Raum ist dieser Zeitslot bereits reserviert.',true);return}
      data.reservations.push({id:makeId(),room,date,time,reason});store();go('rooms');toast('Demo-Raum erfolgreich reserviert.');return}
      if(f.id==='transferForm'){const amount=Number(fd.get('amount'));const cents=Math.round(amount*100);if(!Number.isFinite(amount)||cents<=0||cents>data.balance){toast('Ungültiger Betrag oder zu wenig Guthaben.',true);return}data.balance-=cents;data.tx.unshift({id:makeId(),label:'Demo-Überweisung an '+String(fd.get('to')),desc:'Nur lokale Simulation',amount:-cents,when:'Gerade eben'});store();closeModal();go('wallet');toast('Demo-Überweisung gebucht.');return}
      if(f.id==='foundForm'){const item=String(fd.get('item')).trim(),place=String(fd.get('place')).trim();if(!item||!place)return;closeModal();toast('Formular getestet. Es wurde nichts versendet.');return}}
    function start(){ $('searchIcon').innerHTML=icon('search',17);$('bellButton').innerHTML=icon('bell',18);document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('input',e=>{if(e.target.id==='globalSearch')renderSearch(e.target.value)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal()}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();searchModal()}});const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('pay=')){const inv=parsePayment(hash);go('wallet');if(inv)openInvoice(inv);else toast('Ungültiger Zahlungslink.',true);return}if(hash.startsWith('room=')){const room=rooms.find(r=>r.id===hash.slice(5));if(room){selectedRoom=room.id;selectedFloor=room.floor;go('map');return}}go(pageNames[hash]?hash:'home')}
    start();
  })();
  </script>
</body>
</html>
